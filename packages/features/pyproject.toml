[project]
name = "cursora-features"
version = "0.1.0"
description = "Signal -> feature vector extraction shared by the API (inference) and ML (training)."
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
