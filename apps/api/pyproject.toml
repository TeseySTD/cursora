[project]
name = "cursora-api"
version = "0.1.0"
description = "Cursora backend: FastAPI modular monolith."
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.20.0",
  "asyncpg>=0.32.0",
  "cursora-features",
  "fastapi>=0.157.0",
  "pydantic-settings>=2.16.1",
  "sqlalchemy[asyncio]>=2.1.5",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
cursora-features = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: needs a reachable PostgreSQL (skipped when unavailable unless REQUIRE_DB=1)",
]
