# Full stack: docker compose -f infra/compose/compose.yml up   (or: pnpm docker:up)
name: cursora

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cursora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cursora}
      POSTGRES_DB: ${POSTGRES_DB:-cursora}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      CURSORA_ENV: ${CURSORA_ENV:-prod}
      CURSORA_LOG_LEVEL: ${CURSORA_LOG_LEVEL:-INFO}
      CURSORA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cursora}:${POSTGRES_PASSWORD:-cursora}@postgres:5432/${POSTGRES_DB:-cursora}
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "${CURSORA_HTTP_PORT:-8080}:8080" # Cursora: admin, /api/, /widget/
      - "${ORIGIN_HTTP_PORT:-8081}:8081" # sample protected customer site
    depends_on:
      api:
        condition: service_healthy
      origin:
        condition: service_started

  # Placeholder customer backend; replaced by the demo site later.
  origin:
    image: traefik/whoami:v1.12.0

volumes:
  pgdata:
