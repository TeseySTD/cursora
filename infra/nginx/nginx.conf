# Cursora Nginx. Routing only: no business logic lives here.
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's embedded DNS. Upstreams below use `resolve`, so container names are
  # looked up at runtime: nginx starts (and `nginx -t` passes) even if they are not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;

  include /etc/nginx/conf.d/*.conf;
}
