# Sample customer site (port 8081): Nginx in front of the customer's backend.
#
# How auth_request works here:
#   1. A request hits a protected location (/protected/).
#   2. Before proxying it, Nginx sends an internal subrequest to /_cursora/gate,
#      which forwards ONLY the headers (no body) to FastAPI GET /v1/gate/check.
#   3. FastAPI answers:
#        2xx      -> Nginx forwards the original request to the origin;
#        401/403  -> Nginx returns that status to the client (origin never sees it);
#        other    -> Nginx returns 500.
#   4. Unprotected locations skip the subrequest entirely.
#
# TODO(team): which codes the gate returns for challenge_required / blocked, and how
# Nginx turns them into a challenge (error_page -> redirect to the widget page?).
# TODO(team): how the gate identifies the site (header with the site key? host?).
server {
  listen 8081;
  server_name _;

  location /protected/ {
    auth_request /_cursora/gate;
    proxy_pass http://origin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Internal only: clients cannot call this location directly.
  location = /_cursora/gate {
    internal;
    proxy_pass http://cursora_api/v1/gate/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # Context for the gate decision: what the client originally asked for.
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Everything else goes straight to the origin, without asking Cursora.
  location / {
    proxy_pass http://origin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
