# Cursora service host (port 8080): admin SPA, widget script, API.
server {
  listen 8080;
  server_name _;

  # FastAPI. The /api prefix is stripped; uvicorn runs with --root-path /api so /api/docs works.
  location /api/ {
    proxy_pass http://cursora_api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The embeddable widget. Third-party pages load it with <script src=".../widget/widget.js">.
  location = /widget/widget.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=300";
    add_header Access-Control-Allow-Origin "*";
  }

  # Admin SPA: unknown paths fall back to index.html for client-side routing.
  location / {
    root /usr/share/nginx/html/admin;
    try_files $uri $uri/ /index.html;
  }
}
