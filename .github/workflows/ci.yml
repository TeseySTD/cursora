name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists PR files via the API

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.shared == 'true' || steps.filter.outputs.python == 'true' }}
      frontend: ${{ steps.filter.outputs.shared == 'true' || steps.filter.outputs.frontend == 'true' }}
      contract: ${{ steps.filter.outputs.shared == 'true' || steps.filter.outputs.contract == 'true' }}
      docker: ${{ steps.filter.outputs.shared == 'true' || steps.filter.outputs.docker == 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          # `shared` files affect every job.
          filters: |
            shared:
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - pyproject.toml
              - uv.lock
              - .nvmrc
              - .python-version
              - tsconfig.base.json
              - eslint.config.js
              - .prettierrc.json
              - .prettierignore
              - scripts/**
              - .github/workflows/**
            python:
              - apps/api/**
              - packages/features/**
              - ml/**
            frontend:
              - apps/widget/**
              - apps/admin/**
              - packages/api-client/**
            contract:
              - apps/api/**
              - packages/features/**
              - packages/api-client/**
            docker:
              - infra/**
              - .dockerignore
              - apps/**
              - packages/**

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: cursora
          POSTGRES_PASSWORD: cursora
          POSTGRES_DB: cursora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cursora -d cursora"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      UV_LOCKED: "1"
      # Integration tests must fail, not skip, if the database is unreachable.
      REQUIRE_DB: "1"
      CURSORA_DATABASE_URL: postgresql+asyncpg://cursora:cursora@127.0.0.1:5432/cursora
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: pnpm bootstrap
      - run: pnpm format:check:py
      - run: pnpm lint:py
      - run: pnpm typecheck:py
      - run: pnpm db:migrate
      - run: pnpm test:api
      - run: pnpm test:features
      - run: pnpm test:ml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check:js
      - run: pnpm lint:js
      - run: pnpm typecheck:js
      - run: pnpm test:widget
      - run: pnpm test:admin
      - run: pnpm build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: widget
          path: apps/widget/dist/widget.js
          if-no-files-found: error
      # Writes the size table to the job summary. Budget: apps/widget/size-budget.config.mjs
      # (warning only unless its mode is "error").
      - name: Widget size budget
        run: pnpm size:widget

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      # No `pnpm install`: the check only needs Node, pnpm (to run the script) and uv.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      # Re-exports openapi.json from FastAPI and fails if it differs from the commit.
      # The TS client is not committed; jobs that need it generate it on install.
      - run: pnpm api:check

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      # The helper scripts only need Node; no dependency install required.
      - run: node scripts/compose.mjs prod config --quiet
      - run: node scripts/compose.mjs prod build
      - run: node scripts/compose.mjs prod run --rm --no-deps nginx nginx -t
      - run: node scripts/actionlint.mjs

  # Single required status check for branch protection. Skipped jobs count as success.
  ci-ok:
    needs: [changes, python, frontend, contract, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "One or more jobs failed or were cancelled."
            exit 1
          fi
          echo "All jobs passed or were skipped."
