# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
#
# cubic AI review for TeseySTD/cursora. Public repository: reviews are free (fair-use limits).
# cubic reads this file from the default branch (main) only, so edits apply after they are merged.
# cubic picks up context files by name (AGENTS.md, CLAUDE.md, README.md, "*-context.md"); the
# instructions below also point the reviewer at docs/project-context.md explicitly.
# Limits: 5 custom agents per repository, each at most 10,000 characters.
version: 1

reviews:
  enabled: true
  sensitivity: medium
  incremental_commits: true
  check_drafts: false
  architecture_diagrams: false
  merge_confidence_summary: false
  resolve_threads_when_addressed: true
  # Keep false: cubic does not document how it classifies collaborators on a personal-account
  # repository, and true could turn teammates' PRs into manual-only reviews.
  external_contributors_require_manual_review: false
  auto_approve_behavior: disabled
  auto_approve: disabled
  custom_instructions: |
    Project: Cursora, a bot-protection / CAPTCHA service. Treat AGENTS.md (conventions) and
    docs/project-context.md (business rules BR-n, requirements, open questions OQ-n) as the
    source of truth. When code contradicts them, name the rule and the file. Only Decided and
    Repo items in docs/project-context.md are settled; code that settles an Open item (OQ-n)
    must leave a TODO(team) instead.
    Domain vocabulary: session statuses new / challenge_required / verified / blocked; risk
    decisions allow / challenge / block; final verdicts human / suspicious / bot; sensitivity is
    one integer 0-100 per site. Flag other spellings or extra states.
    Write in English. Be concise: one issue per comment, with the problem, why it matters and the
    fix. No praise and no restating the diff. Skip formatting and lint issues that ruff,
    mypy --strict, ESLint, tsc and Prettier already enforce in CI (`pnpm check`).
    Never invent product requirements, schemas, thresholds, weights, score ranges or HTTP status
    codes. Flag hard-coded values that docs/project-context.md does not define and ask for a
    `TODO(team): ...` instead of proposing numbers.
    Fingerprints are stored, compared, logged and returned only as HMAC hashes. Flag any raw
    fingerprint in logs, database columns, API responses, error messages or test fixtures.
    PostgreSQL is the only datastore: flag Redis or any other cache or queue.
    Flag committed secrets or real credentials (code, .env.example, compose files, workflows).
    PR titles follow `CAPTHCA-<n>: summary`; commits follow Conventional Commits.
  ignore:
    files:
      - pnpm-lock.yaml
      - uv.lock
      - "**/dist/**"
      - ml/notebooks/**
      # Generated by the OpenSpec CLI; reviewed when the team bumps the OpenSpec version.
      - .claude/skills/openspec-*/**
      - .claude/commands/opsx/**
    pr_titles:
      - "WIP*"
    pr_labels:
      - skip-review
  custom_rules:
    - name: API layering and pure risk engine
      include:
        - apps/api/src/**
      description: |
        apps/api is a FastAPI modular monolith (Python 3.14, async SQLAlchemy 2.1 + asyncpg,
        pydantic-settings). One module per bounded context: tenant, sessions, risk, gate, insights.
        Flag:
        - Layering breaks. Each module is router -> service -> repository -> models/schemas.
          router.py only maps HTTP to schemas and calls a service; SQLAlchemy queries live in
          repository.py; business rules live in service.py.
        - Cross-module access to another module's repository, models or tables. Modules talk to
          each other through services only.
        - Blocking I/O in async code (sync HTTP clients, time.sleep, sync DB drivers).
        - Settings read outside core/config.py (pydantic-settings, CURSORA_ prefix). New settings
          must also be added to .env.example.
        - Any impurity in modules/risk/evaluator.py or modules/risk/rules/: I/O, database,
          network, logging side effects, clock (datetime.now, time.time), randomness, environment
          or settings reads, or module-level mutable state. RiskEvaluator is pure and
          deterministic: features + sensitivity + optional ml_score in, RiskResult out. Loading
          site settings or calling a model belongs in risk/service.py before evaluate().
        - ML scoring that bypasses the MlScorer port (modules/risk/ml_port.py), or an evaluator
          that cannot decide when ml_score is None.
        - Feature extraction re-implemented in apps/api instead of importing cursora_features.
        - New imports or dependencies on pandas, scikit-learn, jupyter or Redis in apps/api.
        - gate/router.py doing more than mapping the request for Nginx auth_request. The status
          codes for challenge and block are TODO(team): flag invented codes.
        - Route or schema changes without a regenerated packages/api-client/openapi.json
          (`pnpm api:openapi`) in the same PR, and breaking contract changes (removed or renamed
          routes, fields or enum values, changed status codes or required fields) that the PR
          description does not call out; the admin uses the generated client.
        - Missing unit tests for new rules, decision branches or service logic.
    - name: Database models and Alembic migrations
      include:
        - apps/api/alembic/**
        - apps/api/src/cursora_api/modules/*/models.py
        - apps/api/src/cursora_api/core/db.py
      description: |
        Models live in each module's models.py on the shared DeclarativeBase (core/db.py).
        Flag:
        - Model changes without an Alembic migration in the same PR (`pnpm db:revision "<msg>"`),
          or a migration that does not match the models.
        - Edits to migrations that are already on main; add a new revision instead.
        - Missing or broken downgrade(), or destructive changes (drop/rename column, type change)
          without an explicit data migration.
        - A new module whose models are not imported in alembic/env.py (autogenerate misses it).
        - Columns that would hold raw fingerprints; only HMAC hashes may be stored.
        - JSONB used for data with a fixed, queried structure, or new lookup columns without an
          index. PostgreSQL only; no Redis.
    - name: Widget Shadow DOM and size budget
      include:
        - apps/widget/**
      description: |
        The widget ships as one IIFE (dist/widget.js) mounted in a Shadow DOM on third-party
        pages (React 19, Tailwind CSS v4, shadcn/Radix). Flag:
        - CSS that leaves the shadow root: style injection into document.head or document.body,
          global selectors that rely on the host page, or CSS imported outside mount.tsx's
          inline stylesheet.
        - Radix/shadcn portals (Popover, Tooltip, Dialog, Select, ...) without
          container={usePortalContainer()}; they would render into document.body unstyled.
        - Code that relies on :root variables or the host page's rem size; plugins/shadow-dom-css.ts
          rewrites :root to :host and rem to px.
        - Bundle growth: new runtime dependencies, whole-library imports or code that could be
          lazy or native. The gzip budget is checked by `pnpm size:widget`
          (size-budget.config.mjs; the budget value itself is TODO(team)).
        - Signal collection that is not listed in docs/project-context.md, pointer/touch
          listeners that are not passive or not removed on unmount, console logging of signals,
          or network calls to anything except the Cursora API.
        - Missing Vitest + Testing Library tests for new behaviour.
    - name: Admin SPA and API contract
      include:
        - apps/admin/**
        - packages/api-client/**
      description: |
        Admin SPA: React 19, React Router 8, TanStack Query 5, shadcn/ui, Tailwind CSS v4.
        packages/api-client: openapi.json is exported from FastAPI and committed; the TypeScript
        client in src/generated/ is generated on install/build and is gitignored. Flag:
        - Hand-written fetch/axios calls or hand-written API types for Cursora endpoints in the
          admin; use @cursora/api-client (configured in src/lib/api.ts) with TanStack Query.
        - Any committed file under packages/api-client/src/generated/.
        - Manual edits to openapi.json; it must come from `pnpm api:openapi`. (.gitattributes
          marks it linguist-generated, so its diff may be skipped; `pnpm api:check` in CI
          catches a stale file.)
        - Settings UI that allows a sensitivity outside 0-100, or statistics views that expose
          per-visitor data instead of aggregates.
        - Missing loading/error states, inputs without labels, and edits to generated shadcn
          components in src/components/ui when composing them would do.
    - name: Shared features, ML, infra, CI and AI tooling
      include:
        - packages/features/**
        - ml/**
        - infra/**
        - .github/**
        - scripts/**
        - .claude/**
        - AGENTS.md
        - CLAUDE.md
        - openspec/config.yaml
        - cubic.yaml
      description: |
        Flag, by path:
        - packages/features (cursora-features): the only signal -> feature implementation, used
          by the API for serving and by ml for training. It must stay pure Python with no
          third-party runtime dependencies (no pandas, numpy or scikit-learn), deterministic and
          without I/O. Changing feature names or meaning needs tests and a note that models must
          be retrained.
        - ml: pandas and scikit-learn are allowed here only. Features must come from
          cursora_features.extract_features, never a copy. Training should be reproducible
          (fixed random seeds); never commit data or model artefacts (ml/data, ml/models).
        - infra/nginx: no business logic. Protected locations only use auth_request to an
          internal location that proxies to /v1/gate/check and act on the status (2xx allow,
          401/403 deny). Flag njs/lua, map or if based allow/deny rules, duplicated risk logic, a
          gate location without `internal;`, or a gate subrequest that forwards the body.
        - infra/docker and infra/compose: pin base images to exact versions, no secrets in
          images or compose files, keep compose.yml and compose.dev.yml consistent.
        - .github/workflows: pin actions to exact versions, least-privilege permissions, no
          pull_request_target with a checkout of PR code, no secrets in logs. New jobs must be
          added to ci-ok's `needs`, and new top-level paths to the dorny/paths-filter filters.
        - scripts: cross-platform Node ESM (Windows, macOS, Linux), wired through root
          package.json scripts; no Makefile, justfile or bash-only helpers.
        - AI tooling: AGENTS.md is the single source of truth; CLAUDE.md and other tool files
          only point to it. Vendored skills in .claude/skills keep their LICENSE and SOURCE.md
          and must not gain allowed-tools grants, commands that run on load, network calls or
          hidden instructions; flag edits to them that are not a documented upstream update.
          .claude/settings.json must not allow broad commands (Bash(*), curl, rm) or weaken the
          deny rules for .env files. Files under openspec/ other than config.yaml must never be
          committed.

pr_descriptions:
  # Keep the human-written PR template (What / Jira / How to test / Checklist).
  generate: false
  cubic_review_link: false

issues:
  # Fixes stay manual for the team; set pr_comment_fixes to true to let cubic push requested fixes.
  fix_with_cubic_buttons: false
  pr_comment_fixes: false
  auto_fix: "off"
